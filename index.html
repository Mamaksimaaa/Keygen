<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID HUB · Получить ключ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="particles" id="particles"></div>

    <main class="card">
        <!-- Логотип SVG -->
        <div class="logo-wrap">
            <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Основной градиент crimson -> purple -->
                    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#DC143C"/>
                        <stop offset="50%" stop-color="#FF2079"/>
                        <stop offset="100%" stop-color="#9B30FF"/>
                    </linearGradient>
                    <!-- Градиент для портала внутри -->
                    <radialGradient id="voidGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#1a0a2e"/>
                        <stop offset="40%" stop-color="#DC143C" stop-opacity="0.6"/>
                        <stop offset="70%" stop-color="#9B30FF" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="transparent"/>
                    </radialGradient>
                    <!-- Градиент для внутреннего кольца -->
                    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#DC143C" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="#9B30FF" stop-opacity="0.9"/>
                    </linearGradient>
                    <!-- Свечение -->
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="4" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Внешнее свечение гексагона (ореол) -->
                <polygon class="hex-glow"
                    points="100,8 178,54 178,146 100,192 22,146 22,54"
                    fill="none" stroke="url(#hexGrad)" stroke-width="2"
                    filter="url(#glowStrong)" opacity="0.4"/>

                <!-- Основной гексагон -->
                <polygon class="hex-main"
                    points="100,18 170,58 170,142 100,182 30,142 30,58"
                    fill="none" stroke="url(#hexGrad)" stroke-width="2.5"
                    filter="url(#glow)" opacity="0.9"/>

                <!-- Внутренний гексагон (поменьше) -->
                <polygon class="hex-inner"
                    points="100,38 150,68 150,132 100,162 50,132 50,68"
                    fill="none" stroke="url(#hexGrad)" stroke-width="1"
                    filter="url(#innerGlow)" opacity="0.4"/>

                <!-- Портал / Void внутри -->
                <circle class="void-core" cx="100" cy="100" r="28"
                    fill="url(#voidGrad)" filter="url(#glowStrong)" opacity="0.8"/>

                <!-- Вращающееся кольцо портала -->
                <circle class="void-ring" cx="100" cy="100" r="32"
                    fill="none" stroke="url(#ringGrad)" stroke-width="1.5"
                    stroke-dasharray="8 12" filter="url(#glow)" opacity="0.7"/>

                <!-- Внутреннее кольцо портала -->
                <circle class="void-ring-inner" cx="100" cy="100" r="20"
                    fill="none" stroke="url(#ringGrad)" stroke-width="1"
                    stroke-dasharray="4 8" filter="url(#innerGlow)" opacity="0.5"/>

                <!-- Точка в центре -->
                <circle cx="100" cy="100" r="3"
                    fill="#FF2079" filter="url(#glowStrong)" opacity="0.9"/>

                <!-- Геометрические линии от центра к вершинам -->
                <line x1="100" y1="100" x2="100" y2="38" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.3" filter="url(#innerGlow)"/>
                <line x1="100" y1="100" x2="100" y2="162" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.3" filter="url(#innerGlow)"/>
                <line x1="100" y1="100" x2="50" y2="68" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.3" filter="url(#innerGlow)"/>
                <line x1="100" y1="100" x2="150" y2="132" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.3" filter="url(#innerGlow)"/>
                <line x1="100" y1="100" x2="50" y2="132" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.3" filter="url(#innerGlow)"/>
                <line x1="100" y1="100" x2="150" y2="68" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.3" filter="url(#innerGlow)"/>

                <!-- Маленькие точки на вершинах внутреннего гексагона -->
                <circle cx="100" cy="38" r="2" fill="#DC143C" filter="url(#glow)" opacity="0.7"/>
                <circle cx="150" cy="68" r="2" fill="#C82070" filter="url(#glow)" opacity="0.7"/>
                <circle cx="150" cy="132" r="2" fill="#9B30FF" filter="url(#glow)" opacity="0.7"/>
                <circle cx="100" cy="162" r="2" fill="#9B30FF" filter="url(#glow)" opacity="0.7"/>
                <circle cx="50" cy="132" r="2" fill="#DC143C" filter="url(#glow)" opacity="0.7"/>
                <circle cx="50" cy="68" r="2" fill="#C82070" filter="url(#glow)" opacity="0.7"/>
            </svg>
        </div>

        <h1 class="brand-title">VOID HUB</h1>
        <p class="subtitle">Премиум система генерации ключей</p>

        <div class="divider"></div>

        <!-- Основной блок (динамически меняется) -->
        <div id="content">

            <!-- Состояние: Загрузка -->
            <div id="state-loading" class="state">
                <div class="spinner"></div>
                <p class="state-text">Проверка устройства...</p>
            </div>

            <!-- Состояние: Получить ключ -->
            <div id="state-ready" class="state hidden">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Срок</span>
                        <span class="info-value">24 часа</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Лимит</span>
                        <span class="info-value">1 / IP</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Устройств</span>
                        <span class="info-value">1</span>
                    </div>
                </div>

                <button id="generate-btn" class="btn-primary">
                    <span class="btn-text">ПОЛУЧИТЬ КЛЮЧ</span>
                </button>
            </div>

            <!-- Состояние: Ключ выдан -->
            <div id="state-success" class="state hidden">
                <div class="status-badge success-badge">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3 8L6.5 11.5L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Ключ сгенерирован</span>
                </div>

                <div class="key-box">
                    <code id="key-display"></code>
                    <button id="copy-btn" class="copy-btn" title="Скопировать">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>

                <div class="meta-row">
                    <span class="meta-label">Истекает</span>
                    <span class="meta-value" id="expires-display"></span>
                </div>

                <div class="notice">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M8 4V8.5M8 11.5V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Сохраните ключ — повторная выдача невозможна</span>
                </div>
            </div>

            <!-- Состояние: Ключ уже выдан -->
            <div id="state-existing" class="state hidden">
                <div class="status-badge warning-badge">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 5V8.5M8 11V11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Активный ключ</span>
                </div>

                <div class="key-box">
                    <code id="existing-key-display"></code>
                    <button id="copy-existing-btn" class="copy-btn" title="Скопировать">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>

                <div class="meta-row">
                    <span class="meta-label">Истекает через</span>
                    <span class="meta-value" id="time-left"></span>
                </div>

                <p class="hint">Новый ключ будет доступен после истечения текущего</p>
            </div>

            <!-- Состояние: Ошибка -->
            <div id="state-error" class="state hidden">
                <div class="status-badge error-badge">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Ошибка</span>
                </div>
                <p class="error-text" id="error-text"></p>
                <button id="retry-btn" class="btn-secondary">Повторить</button>
            </div>
        </div>

        <div class="footer">
            <span class="footer-dot"></span>
            VOID HUB v2.0
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
